<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在前往 · 玥动排球系列赛官网</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://yuevolleyball.com">
<meta http-equiv="refresh" content="2; url=https://yuevolleyball.com">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0d1b2a;
    background-image:radial-gradient(circle at 20% 20%,rgba(255,122,41,.18),transparent 45%),
                     radial-gradient(circle at 80% 80%,rgba(41,121,255,.18),transparent 45%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#e8eef4;padding:24px;
  }
  .card{
    max-width:440px;width:100%;text-align:center;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
    border-radius:18px;padding:40px 32px;backdrop-filter:blur(8px);
  }
  .ball{
    width:54px;height:54px;margin:0 auto 22px;border-radius:50%;
    background:linear-gradient(135deg,#ff7a29,#ff4d4d);
    box-shadow:0 8px 28px rgba(255,122,41,.35);
    animation:bounce 1.4s ease-in-out infinite;
  }
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  h1{font-size:19px;font-weight:600;letter-spacing:.02em;margin-bottom:10px}
  p{font-size:14px;line-height:1.75;color:#9fb3c8}
  .domain{font-family:ui-monospace,Menlo,Consolas,monospace;color:#ffb27a}
  .btn{
    display:inline-block;margin-top:26px;padding:12px 28px;border-radius:999px;
    background:linear-gradient(135deg,#ff7a29,#ff4d4d);color:#fff;
    text-decoration:none;font-size:14px;font-weight:600;
    box-shadow:0 8px 24px rgba(255,90,60,.3);transition:transform .18s ease;
  }
  .btn:hover{transform:translateY(-2px)}
  .note{margin-top:20px;font-size:12px;color:#647d94}
</style>
</head>
<body>
  <div class="card">
    <div class="ball"></div>
    <h1>正在前往赛事官网</h1>
    <p>
      <span class="domain" id="from">yuevolleyball.com.cn</span> 已统一至主站<br>
      <span class="domain">yuevolleyball.com</span>
    </p>
    <a class="btn" id="go" href="https://yuevolleyball.com/">立即前往</a>
    <div class="note">若未自动跳转，请点击上方按钮</div>
  </div>
<script>
(function () {
  var MAIN = 'https://yuevolleyball.com';
  var from = document.getElementById('from');
  if (from) from.textContent = location.hostname;

  // 保留原路径、查询串与锚点，例如 /schedule?from=wx → 主站同地址
  var tail = location.pathname + location.search + location.hash;
  if (tail === '/' || tail === '/index.html') tail = '';
  var target = MAIN + tail;

  document.getElementById('go').href = target;
  location.replace(target);
})();
</script>
</body>
</html>
